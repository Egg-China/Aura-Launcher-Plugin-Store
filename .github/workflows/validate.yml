name: Validate Aura plugin store

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Store
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install signer dependencies
        run: npm ci

      - name: Test strict registry signer
        run: npm test

      - name: Validate reviewed registry source
        shell: pwsh
        run: ./tools/validate-store.ps1 -Registry ./registry.json -UnsignedPayload

      - name: Verify published registry envelope
        run: |
          node ./tools/registry-envelope.mjs verify \
            --envelope ./plugins.json \
            --root ./trust/aura-plugin-root.json

      - name: Check out exact Plugin SDK validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: HMCL-Community/HMCL-CE-Plugin-SDK
          ref: 6f170a32b2a7fcc7d750e2190631e60913d31199
          path: .ci/sdk

      - name: Test Store validator
        shell: pwsh
        run: ./tools/test-validate-store.ps1

      - name: Verify public manifests and packages
        shell: pwsh
        run: |
          ./tools/validate-store.ps1 `
              -Registry ./plugins.json `
              -TrustRoot ./trust/aura-plugin-root.json `
              -VerifyRemote `
              -NplValidator ./.ci/sdk/tools/validate-npl.ps1
